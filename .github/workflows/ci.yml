name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Test (no dependencies to install)
        run: npm test
      - name: Linter smoke run on the good examples
        run: |
          node scripts/lint-os-js.mjs scripts/examples/js/good-chart-onready.js scripts/examples/js/good-chart-ondestroy.js scripts/examples/js/good-async-node.js
          node scripts/check-names.mjs scripts/examples/inventory/good-request-cw.json
